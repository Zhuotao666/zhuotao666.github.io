{{ with resources.Get "css/earth-background.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" crossorigin="anonymous">
{{ end }}
<div class="earth-background" aria-hidden="true">
  <canvas id="earth-background"></canvas>
</div>
{{ with resources.Get "js/earth-background.js" | minify | fingerprint }}
<script defer src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" crossorigin="anonymous"></script>
{{ end }}
