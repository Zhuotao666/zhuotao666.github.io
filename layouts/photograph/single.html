{{ define "main" }}
  <article class="max-w-5xl mx-auto px-4 py-8">
    <nav class="mb-8">
      <a href="{{ "/categories/" | relLangURL }}" class="inline-flex items-center text-sm text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-300 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Photograph
      </a>
    </nav>

    <header class="mb-8">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-gray-100">{{ .Title }}</h1>
      {{ with .Description }}
        <p class="mt-3 text-lg leading-relaxed text-gray-600 dark:text-gray-300">{{ . }}</p>
      {{ end }}
    </header>

    {{ with .Content }}
      <div class="prose prose-sm sm:prose lg:prose-lg max-w-none mb-8 dark:text-gray-100">
        {{ . }}
      </div>
    {{ end }}

    {{ with .Params.photos }}
      <section class="grid gap-6">
        {{ range . }}
          {{ $src := index . "src" }}
          {{ $alt := index . "alt" }}
          {{ $caption := index . "caption" }}
          <figure class="overflow-hidden rounded-lg bg-white dark:bg-slate-900 shadow-sm">
            <img src="{{ $src }}" alt="{{ $alt }}" class="w-full object-cover">
            {{ with $caption }}
              <figcaption class="px-5 py-4 text-sm text-gray-600 dark:text-gray-300">{{ . }}</figcaption>
            {{ end }}
          </figure>
        {{ end }}
      </section>
    {{ end }}
  </article>
{{ end }}
